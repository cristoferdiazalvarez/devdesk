name: CI DevDesk
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: devdesk_test
          POSTGRES_USER: devdesk
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -U devdesk -d devdesk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://devdesk@localhost:5432/devdesk_test
      TEST_DATABASE_URL: postgresql://devdesk@localhost:5432/devdesk_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Generar contraseña efímera de la demo
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          printf 'LOCAL_DEMO_PASSWORD=%s\n' "$password" >> "$GITHUB_ENV"
      - run: npm run db:seed
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: capturas-devdesk
          path: "test-results/**/resumen.png"
          if-no-files-found: ignore
