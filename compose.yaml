services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: devdesk
      POSTGRES_USER: devdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - devdesk_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devdesk"]
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  devdesk_pg:
