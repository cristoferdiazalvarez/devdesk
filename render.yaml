# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: devdesk-api
    runtime: node
    plan: free
    autoDeployTrigger: "off"
    buildCommand: npm ci --include=dev && npm run build -w apps/api
    startCommand: npm run start:render
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: devdesk-db
          property: connectionString
      - key: WEB_ORIGIN
        sync: false
      - key: ALLOW_REGISTRATION
        value: "false"
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: DEMO_VIEW
        value: "true"
databases:
  - name: devdesk-db
    plan: free
    ipAllowList: []
    postgresMajorVersion: "17"
